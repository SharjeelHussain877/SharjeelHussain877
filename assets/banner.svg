    <circle cx="820" cy="70" r="2.5" fill="#8b949e"/>
    <circle cx="750" cy="200" r="2.5" fill="#8b949e"/>
    <circle cx="830" cy="180" r="2.5" fill="#8b949e"/>
    <circle cx="960" cy="70" r="2.5" fill="#8b949e"/>
    <circle cx="980" cy="180" r="2.5" fill="#8b949e"/>
    <circle cx="1100" cy="90" r="2.5" fill="#8b949e"/>
    <circle cx="1120" cy="200" r="2.5" fill="#8b949e"/>
    <circle cx="870" cy="230" r="2.5" fill="#8b949e"/>
    <circle cx="1000" cy="240" r="2.5" fill="#8b949e"/>
