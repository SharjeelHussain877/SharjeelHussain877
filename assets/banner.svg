  <!-- text block -->
  <text x="60" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#8b949e">KARACHI, PAKISTAN · 3 YEARS IN PRODUCTION</text>

  <text x="58" y="128" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.5" fill="#e6edf3">Sharjeel Hussain</text>

  <text x="60" y="166" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="url(#accentGrad)">Full Stack Engineer · SaaS Builder · AI Enthusiast</text>

  <line x1="60" y1="188" x2="130" y2="188" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

  <text x="60" y="222" font-family="Consolas, Menlo, monospace" font-size="14" fill="#8b949e">Engineering meets AI — production SaaS, real users, real APIs.</text>
